#
# UNCONDITIONALLY WIRED INTO BOTH WORKFLOWS (OPENAI_API_KEY exists as a
# proven repo secret; issue #155 closed the conditional-fallback trap):
# - .github/workflows/capsule-implement.yml mounts this bundle via
#   ATTRACTOR_PIPELINE_BUNDLE for task-runner.dot's critique_b node
#   (llm_provider="openai").
# - .github/workflows/capsule-specify.yml mounts it the same way for
#   capsule.dot's critique node (the lean rebuild's ONE judgment node, which
#   likewise hard-declares llm_provider="openai" -- without this bundle it
