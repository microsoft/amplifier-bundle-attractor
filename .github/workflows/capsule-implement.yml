# Capsule Implement -- the "implement" stage of an issue -> attractor -> PR
# system. See .github/capsule-pipeline/README.md for what this is and why
# the vendored files under that directory exist.
#
# TRIGGER DESIGN (per DESIGN-issue-to-attractor-pipeline.md section 2/5:
# "labels are an index, the capsule PR is the transaction"):
#
#   Real trigger = a human MERGES a capsule PR (pull_request: closed,
#   merged == true, scoped to the proposals/ path). This is the design's
#   second human gate. Options considered and rejected:
#     - A `ready:build` LABEL: rejected for the same reason v0.1's label-
#       as-state-store was rejected in the design doc section 5 -- "a
#       label is a claim by construction... no provenance, no run ID; you
#       cannot distinguish 'never ran' from 'ran and failed' from 'someone
#       removed it.'" Adding a second label just to re-derive a signal the
#       merge event for the SAME PR already carries atomically is pure
#       overhead with none of the merge event's benefits (attribution,
#       diff, revertability).
#     - workflow_dispatch ONLY: loses the automatic hand-off entirely --
#       a human would have to remember to go run something after merging,
#       defeating the point of "merge IS the yes-build-this signal."
#   workflow_dispatch is KEPT as the manual re-run / pre-merge-testing
#   path (same rationale as capsule-specify.yml's own workflow_dispatch
#   input) -- it takes a capsule_path directly, since a manual invocation
#   has no merged PR to read files from.
#
#   PRE-MERGE PROOF NOTE: `issues`/`workflow_dispatch` triggers are only
#   ever evaluated by GitHub Actions against the workflow file on the
#   DEFAULT branch (confirmed empirically by this repo's own
#   capsule-specify.yml history -- see commits e2b4206/71e6c4c on the
#   branch that introduced it). `pull_request` is the one trigger GitHub
#   evaluates using the PR branch's OWN copy of a workflow file, so this
#   repo's established pattern for proving a brand-new workflow before
#   merge is a TEMPORARY `pull_request: [opened, synchronize]` trigger,
#   exercised for real once, then reverted in a follow-up commit before
#   the PR is left for review. If this file's git history shows such a
#   temporary trigger, it means the current run being pointed to as proof
#   used that equivalent path, NOT the real merged-PR event (which cannot
#   fire until a capsule PR is actually merged) -- see the PR body / final
#   report for which path was actually exercised for the proof run.
#
# IDEMPOTENCY: a capsule is uniquely identified by (issue number, capsule
# id) -- both derived from the proposal directory naming convention
# `.github/capsule-pipeline/proposals/issue-<N>/<id>.md` that
# capsule-specify.yml itself established. This workflow computes a
# deterministic branch name `implement/issue-<N>-<id>` and refuses to
# re-run task-runner.dot (an expensive, multi-hour operation) if that
# branch already exists on the remote -- covering "merge event fires
# twice", "someone re-dispatches manually after a prior success", and
# "someone re-dispatches while a prior run is still in flight" (the last
# one is also covered by `concurrency:` below). A maintainer who genuinely
# wants to force a rebuild deletes the branch (or dispatches a differently
# -named capsule) -- there is no separate force-rebuild input, on purpose:
# a silent "just re-run it" button for a multi-hour, real-money LLM job is
# not something to make one flag away.
#
# HUMAN ABORT: `concurrency: cancel-in-progress: false` means a NEW
# trigger for a DIFFERENT capsule queues behind an in-flight run rather
# than cancelling it (killing a multi-hour convergence run to service an
# unrelated event would waste all its progress) -- but this does NOT
# remove the ability to abort. GitHub's own workflow cancellation (Actions
# tab "Cancel workflow", or `gh run cancel <run-id>`) always works
# regardless of `concurrency:` settings, and is the abort mechanism for a
# run that is visibly going wrong. A finer-grained "check a `halt` label
# between iterations" mechanism is named as future work in the design doc
# (section 8, item 9) but is NOT implemented here: task-runner.dot itself
# has no such check today, and adding one would be an engine change, which
# this workflow deliberately avoids (see the vendored task-runner.dot's
# own provenance header for the one invocation gap that WAS worth a
# workflow-level fix, and why this one isn't handled the same way).
#
# KNOWN, NAMED GAP (not fixed here): task-runner.dot's first deterministic
# check after the maker's first `attempt` is `verify` -- there is no
# pre-attempt re-check of whether the gate is ALREADY green at the current
# HEAD (the "stale gate" scenario named in the design doc section 6: main
# moved and the defect got fixed by something unrelated between specify
# and implement). A run against an already-green gate will simply have
# `attempt` do a near-no-op and `verify` pass immediately -- not corrupted,
# but also not the `resolved-elsewhere` terminal state the design
# document names. Flagged here rather than silently patched into the
# vendored engine.
#
# Job cannot join "CI Gate (all checks passed)" (.github/workflows/ci.yml):
# that aggregate's `needs:` list only ever names job IDs defined inside
# ci.yml itself, so a job in this separate workflow file cannot be added to
# it by accident (same isolation capsule-specify.yml already relies on). A
# failed implement run is real, useful information and is allowed to leave
# this job (and only this job) red.
name: Capsule Implement

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - ".github/capsule-pipeline/proposals/**"
  workflow_dispatch:
    inputs:
      capsule_path:
        description: "Repo-relative path to a capsule .md file to implement (e.g. .github/capsule-pipeline/proposals/issue-144/prefix-sharing-substitution-corruption.md)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# Keyed to the capsule being implemented (merged-PR number, or the
# dispatched capsule path), not to the whole workflow -- two DIFFERENT
# capsules can implement concurrently; the SAME capsule cannot pile up
# concurrent runs. cancel-in-progress: false per the design doc section 5
# ("cancelling a 4h run to service a label event is catastrophic") -- see
# the HUMAN ABORT note above for how a human actually stops a bad run.
concurrency:
  group: capsule-implement-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.capsule_path }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: "Run task-runner.dot (implement stage)"
    runs-on: ubuntu-latest
    # task-runner.dot's own max_pipeline_duration=14400s (4h) is the
    # engine's internal wall; the
    # job wall must clear that plus setup/critique/PR-creation overhead,
    # while staying comfortably under GitHub Actions' 6h hard cap for
    # hosted runners -- same ratio-of-buffer reasoning as
    # capsule-specify.yml's 90min-over-a-60min-engine-wall.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Locate and validate the capsule
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CAPSULE_MD="${{ inputs.capsule_path }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            # Enumerate the merged PR's changed files via the PR files API --
            # merge-strategy-independent (identical result for rebase, squash,
            # and merge-commit merges; no git-range arithmetic against main).
            # --paginate clears the per-page cap so a large PR cannot silently
            # truncate the list. Removed files are excluded: a deletion is not
            # a capsule to implement.
            CHANGED_FILES="$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
              --jq '.[] | select(.status != "removed") | .filename')"

            # A capsule PR ships supporting artifacts NEXT TO the capsule in
            # the same proposal dir (<id>.discrimination.md, <id>.hypothesis.patch,
            # <id>.base-sha, ...), so "any .md under proposals/" is AMBIGUOUS.
            # The previous `... | head -1` silently guessed the alphabetically
            # first .md and picked <id>.discrimination.md over <id>.md the very
            # first time the production trigger fired (PR #171, run 31329562759).
            # The capsule is structurally identifiable instead: it is the one
            # .md whose sibling <id>.verify.sh is in the SAME changed-file set
            # -- a pairing the specify stage's package step guarantees. Zero or
            # multiple such pairs is refused loudly, never guessed.
            MD_CANDIDATES="$(printf '%s\n' "$CHANGED_FILES" \
              | grep -E '^\.github/capsule-pipeline/proposals/issue-[0-9]+/[^/]+\.md$' || true)"
            CAPSULE_MD=""
            PAIRED_COUNT=0
            while IFS= read -r md; do
              [ -n "$md" ] || continue
              if printf '%s\n' "$CHANGED_FILES" | grep -qxF "${md%.md}.verify.sh"; then
                CAPSULE_MD="$md"
                PAIRED_COUNT=$((PAIRED_COUNT + 1))
              fi
            done <<< "$MD_CANDIDATES"

            CANDIDATES_ONE_LINE="$(printf '%s' "${MD_CANDIDATES:-none}" | tr '\n' ' ')"
            if [ "$PAIRED_COUNT" -eq 0 ]; then
              echo "::error::Merged PR #$PR_NUMBER touched .github/capsule-pipeline/proposals/** but no capsule (<id>.md with its sibling <id>.verify.sh in the same PR) was found among its changed files -- refusing to guess. .md candidates seen: $CANDIDATES_ONE_LINE" >&2
              exit 1
            fi
            if [ "$PAIRED_COUNT" -gt 1 ]; then
              echo "::error::Merged PR #$PR_NUMBER contains $PAIRED_COUNT capsule (<id>.md + <id>.verify.sh) pairs -- one capsule per capsule PR; refusing to guess which one to implement. .md candidates seen: $CANDIDATES_ONE_LINE" >&2
              exit 1
            fi
          fi

          if [ ! -f "$CAPSULE_MD" ]; then
            echo "::error::Capsule file not found at '$CAPSULE_MD' (checked out at main HEAD)." >&2
            exit 1
          fi

          ISSUE_NUMBER="$(printf '%s' "$CAPSULE_MD" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' | head -1 || true)"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not derive an issue number from capsule path '$CAPSULE_MD' (expected .../proposals/issue-<N>/...)." >&2
            exit 1
          fi

          CAPSULE_ID="$(basename "$CAPSULE_MD" .md)"
          VERIFY_SH="$(dirname "$CAPSULE_MD")/$CAPSULE_ID.verify.sh"
          if [ ! -f "$VERIFY_SH" ]; then
            echo "::error::Expected sibling gate script not found: $VERIFY_SH" >&2
            exit 1
          fi

          IMPLEMENT_BRANCH="implement/issue-${ISSUE_NUMBER}-${CAPSULE_ID}"

          SKIP=false
          if git ls-remote --exit-code --heads origin "$IMPLEMENT_BRANCH" >/dev/null 2>&1; then
            SKIP=true
            echo "Branch $IMPLEMENT_BRANCH already exists on origin -- this capsule has already been (or is already being) implemented. Skipping the run (idempotency)."
          fi

          {
            echo "capsule_md=$CAPSULE_MD"
            echo "capsule_id=$CAPSULE_ID"
            echo "verify_sh=$VERIFY_SH"
            echo "issue_number=$ISSUE_NUMBER"
            echo "implement_branch=$IMPLEMENT_BRANCH"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

      - name: "Detach the engine: snapshot pipeline-runner out of the workspace"
        if: steps.locate.outputs.skip != 'true'
        # FIRES 9 (run 31760312250) AND 10 (run 31766094504) -- one mechanism.
        # This job used to drive the engine as `uv run --project
        # modules/pipeline-runner`, which puts the ENGINE's own venv, and every
        # path dependency uv installs into it (loop-pipeline, remote-source,
        # unified-llm-client), INSIDE the very workspace this pipeline's maker
        # agents are instructed to rewrite. The engine was standing on its own
        # subject.
        #   - Fire 9: a maker cp'd patched unified_llm files into the in-tree
        #     venv's site-packages; the engine's next glob-model spawn raised
        #     `No module named 'unified_llm._cost'` and an already-PROVEN round
        #     was abandoned.
        #   - Fire 10, quoting its own postmortem: "the engine that spawns the
        #     critique node uses the pipeline-runner module's venv
        #     (modules/pipeline-runner/.venv)... stale, incomplete unified_llm
        #     namespace package... cannot import name 'resolve_latest_for'".
        #     The gate had CONVERGED. The judge could never run.
        # The .dot-side guards (maker env-contract, ambient-install reset guard)
        # shrink the blast radius but cannot close it: a guard that lives inside
        # the run can be out-argued by the run. This step closes it
        # STRUCTURALLY -- the engine's source is copied to $RUNNER_TEMP before
        # anything can touch the workspace, and nothing the pipeline does to the
        # workspace afterwards can reach it.
        #
        # WHY modules/ WHOLESALE: the engine's path dependencies are RELATIVE
        # siblings -- modules/pipeline-runner's [tool.uv.sources] points at
        # ../loop-pipeline and ../remote-source, and loop-pipeline's at
        # ../unified-llm-client. Copying modules/ verbatim preserves that
        # structure, so `--project $RUNNER_TEMP/engine-src/modules/pipeline-runner`
        # resolves exactly what `--project modules/pipeline-runner` used to. No
        # root pyproject.toml is needed: the repo-root one declares no
        # [tool.uv.workspace], so uv resolves modules/pipeline-runner standalone
        # (verified locally -- a snapshot of modules/ alone builds and runs).
        #
        # WHY bundles/ TOO: runner.py's `_local_bundle_path()` resolves the
        # engine's default base bundle RELATIVE TO ITS OWN __file__
        # (`Path(__file__).resolve().parents[3] / "bundles" /
        # "attractor-pipeline.yaml"`). Moving the engine without that directory
        # would silently turn a local-sibling hit into a miss and push the
        # engine onto its git fallback. These workflows all set
        # ATTRACTOR_PIPELINE_BUNDLE explicitly, so that default is unreachable
        # here -- but 20K of YAML is a cheap price for a snapshot that behaves
        # identically to the in-tree layout it replaces, and bundles/ is
        # engine-side content by the same rule as modules/.
        #
        # NOT DETACHED, deliberately: the .dot itself, --cwd, target_dir and
        # uplift_dir all still point at the WORKSPACE. The subject tree is
        # supposed to be the live one; only the engine's own code and venv move.
        #
        # PLACEMENT: immediately after "Locate and validate the capsule", which
        # is read-only (gh api + git ls-remote + file-existence checks) and is
        # the step that decides whether this run happens at all. Strictly before
        # every step that can write into the workspace, and it carries the same
        # `if:` guard as the rest of the job.
        run: |
          set -euo pipefail
          ENGINE_SRC="$RUNNER_TEMP/engine-src"
          rm -rf "$ENGINE_SRC"
          mkdir -p "$ENGINE_SRC"
          # tar, not `cp -a`: the exclusions apply at ARCHIVE time, so a
          # .venv/.git/__pycache__ that somehow already exists in the tree never
          # enters the snapshot at all rather than being copied in and then
          # deleted afterwards.
          tar -cf - \
            --exclude='.venv' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            modules bundles \
          | tar -xf - -C "$ENGINE_SRC"
          echo "engine snapshot: $GITHUB_WORKSPACE/{modules,bundles} -> $ENGINE_SRC/"
          echo "engine snapshot provenance: base SHA $(git rev-parse HEAD)"
          for required in \
            "modules/pipeline-runner/pyproject.toml" \
            "modules/loop-pipeline/pyproject.toml" \
            "modules/unified-llm-client/pyproject.toml" \
            "modules/remote-source/pyproject.toml" \
            "bundles/attractor-pipeline.yaml"; do
            if [ ! -f "$ENGINE_SRC/$required" ]; then
              echo "::error::Engine snapshot at $ENGINE_SRC is missing $required -- the detached engine would be unusable and the run step would fail later with a confusing uv error. Refusing to start." >&2
              exit 1
            fi
          done
          if [ -n "$(find "$ENGINE_SRC" -name .venv -print -quit)" ]; then
            echo "::error::Engine snapshot at $ENGINE_SRC contains a .venv -- the tar exclusion did not hold, so the engine is not actually detached from the workspace. Refusing to start." >&2
            exit 1
          fi
          echo "engine snapshot verified: pipeline-runner project present, no .venv carried in"

      - uses: actions/setup-python@v5
        if: steps.locate.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.locate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Configure commit identity for the run
        if: steps.locate.outputs.skip != 'true'
        # task-runner.dot's `package` node commits the fix itself (an LLM
        # box node, not workflow glue) -- it is instructed to add the
        # standard Amplifier co-authored-by trailer, but does not pin an
        # author identity. Setting it globally here means that commit
        # inherits it, same as any other commit made in this job.
        run: |
          git config --global user.name "Brian Krabach"
          git config --global user.email "brkrabac@microsoft.com"

      - name: "Preflight: dual-family critique is unserviceable without an OpenAI key"
        id: preflight
        if: steps.locate.outputs.skip != 'true'
        # Issue #155: an unserviceable provider on a node used to drain the
        # ENTIRE iteration budget in a crash loop (`resolve_latest_for: no
        # adapter found for provider 'openai'`) before failing -- burning
        # 20+ minutes to say what could be said in one line at startup. The
        # vendored task-runner.dot's critique_b node HARD-DECLARES
        # llm_provider="openai" (restored to the pristine upstream shape;
        # see that file's own header) and this job now unconditionally
        # mounts attractor-pipeline-dual.yaml to serve it -- there is no
        # more silent single-provider fallback at either layer. So: check
        # the one precondition that makes that mount meaningful BEFORE
        # spending any of the run's 30-90+ minute budget, and fail loudly,
        # naming exactly what's missing and what capability is lost, if it
        # isn't met.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::capsule-implement: OPENAI_API_KEY secret is missing. task-runner.dot's critique_b node requires llm_provider=\"openai\" (dual-family critique -- an independent, different-model-family reviewer is the point; see issue #155) and this job unconditionally mounts attractor-pipeline-dual.yaml to serve it. Without OPENAI_API_KEY that mount cannot serve a real OpenAI model, and running anyway would either crash the node every round (draining the whole iteration budget on a crash loop) or silently degrade to single-family review depending on engine version -- both are exactly the failure this preflight exists to prevent. Refusing to start. Provision OPENAI_API_KEY as a repo secret, then re-run." >&2
            exit 1
          fi
          echo "OPENAI_API_KEY is present -- dual-family critique (Anthropic + OpenAI) can be honored. Proceeding."

      - name: Run task-runner.dot (implement stage)
        id: run
        if: steps.locate.outputs.skip != 'true'
        # continue-on-error: this workflow classifies and reports the
        # result in later steps regardless of exit code -- a genuine
        # non-convergence is honest, useful information, not something to
        # hide behind a green step. The job itself is failed explicitly,
        # later, only when warranted.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # DUAL-FAMILY CRITIQUE, UNCONDITIONALLY WIRED (issue #155): the
          # vendored task-runner.dot's critique_b node declares
          # llm_provider="openai" -- a design requirement, not optional --
          # so this bundle is ALWAYS mounted; there is no single-provider
          # fallback path any more. If OPENAI_API_KEY is unset, the
          # "Preflight: dual-family critique is unserviceable without an
          # OpenAI key" step below fails the job LOUDLY before this step
          # (and the 30-90+ minute run it would otherwise start) ever runs.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATTRACTOR_PIPELINE_BUNDLE: ${{ format('{0}/.github/capsule-pipeline/attractor-pipeline-dual.yaml', github.workspace) }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/capsule-implement/logs"
          # DETACHED ENGINE (fires 9 + 10): --project points at the
          # $RUNNER_TEMP snapshot taken before any maker touched the tree, so
          # the engine's venv and its editable path deps live where workspace
          # churn cannot reach them. --cwd, target_dir and the .dot path below
          # deliberately still point at the WORKSPACE: the subject tree is
          # supposed to be the live one.
          uv run --project "$RUNNER_TEMP/engine-src/modules/pipeline-runner" attractor run \
            .github/capsule-pipeline/task-runner.dot \
            --cwd "$GITHUB_WORKSPACE" \
            --logs-root "$RUNNER_TEMP/capsule-implement/logs" \
            --param task_file="$GITHUB_WORKSPACE/${{ steps.locate.outputs.capsule_md }}" \
            --param target_dir="$GITHUB_WORKSPACE" \
            --param max_iterations=6
          echo "attractor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Scrub secrets from run evidence
        # SECURITY (incident, 2026-08): a worker agent dumped its
        # environment mid-run; the session-observability persister wrote
        # the tool:post payload VERBATIM into .ai/**/events.jsonl --
        # including a literal OPENAI_API_KEY value -- and this workflow
        # uploaded .ai as a public artifact. GitHub's live-log secret
        # masking does NOT touch files written to disk, so the artifact
        # carried the real key. This step redacts secret-shaped material
        # IN PLACE across the evidence roots (known token shapes,
        # NAME=value secret assignments, and the literal values of the
        # secrets this job actually holds -- which is why they are passed
        # into the env here: the script matches their VALUES, it never
        # prints them). Runs immediately after the pipeline so every later
        # consumer of this evidence -- the postmortem quoted onto the
        # public issue below, and the artifact upload -- sees only
        # scrubbed content. The upload is additionally gated by the
        # residual scan step before the upload step (defense in depth --
        # scrub is best-effort cleaning; the scan is the guarantee).
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/capsule-pipeline/scrub_secrets.py scrub \
            "$RUNNER_TEMP/capsule-implement" \
            "$GITHUB_WORKSPACE/.ai"

      - name: Push fix branch and open PR
        id: pr
        if: always() && steps.locate.outputs.skip != 'true' && steps.run.outputs.attractor_exit == '0'
        # See capsule-specify.yml's "Open capsule PR" step for the
        # confirmed platform limitation this token falls back around:
        # `gh pr create` fails with "GitHub Actions is not permitted to
        # create or approve pull requests" under github.token alone on
        # this org/enterprise. CAPSULE_PR_TOKEN is the proven fine-grained
        # PAT that unblocks it.
        env:
          GH_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          BRANCH="${{ steps.locate.outputs.implement_branch }}"
          ISSUE="${{ steps.locate.outputs.issue_number }}"
          CAPSULE_ID="${{ steps.locate.outputs.capsule_id }}"

          # Defensive: task-runner.dot's own ship_check gate already
          # asserts a clean tree (no tracked .ai/ leakage, no stray
          # porcelain) before reaching `done` -- a second, independent
          # check here costs nothing and this push must start from a
          # genuinely proven tree.
          if [ -n "$(git status --porcelain | grep -v -E '^\?\? \.ai')" ]; then
            echo "::error::Workspace has unexpected changes outside .ai/ after a 'done' run -- refusing to push an unproven tree." >&2
            git status --porcelain >&2 || true
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "::error::task-runner.dot reported success but HEAD matches origin/main -- no fix was actually committed. Refusing to open an empty PR." >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/$BRANCH"

          # Dual-family critique is unconditional as of issue #155's fix --
          # the preflight step earlier in this job already refused to start
          # the run at all if OPENAI_API_KEY were missing, so reaching this
          # point means both critics genuinely ran cross-provider. No
          # degraded-single-family fallback message exists any more.
          DUAL_NOTE="Both reviewers ran as independent, cross-provider critics (Anthropic + OpenAI) -- enforced by this workflow's preflight check, not merely hoped for."

          # MEASURE the gate-modification claim instead of asserting it.
          # Run 31335891096 / PR #178: the previous template asserted the
          # gate was "unmodified" while that very PR edited the gate's
          # verify.sh (a REPO_ROOT path line). Never assert what isn't
          # checked -- diff the proposal dir (capsule .md, verify.sh, and
          # sibling artifacts) against the base this run started from and
          # state the measured result either way.
          PROPOSAL_DIR="$(dirname "${{ steps.locate.outputs.capsule_md }}")"
          GATE_CHANGED="$(git diff --name-only origin/main HEAD -- "$PROPOSAL_DIR")"
          if [ -z "$GATE_CHANGED" ]; then
            GATE_NOTE="Gate files unmodified -- measured: \`git diff --name-only origin/main HEAD -- ${PROPOSAL_DIR}\` is empty."
          else
            GATE_CHANGED_ONE_LINE="$(printf '%s' "$GATE_CHANGED" | tr '\n' ' ')"
            GATE_NOTE="Gate files MODIFIED by this PR (measured): ${GATE_CHANGED_ONE_LINE} -- review the gate diff alongside the fix; a gate edit changes what \"passed\" means."
          fi

          # EXIT distinguishes the two ways this step is reached (see this
          # step's \`if:\`): '0' = task-runner.dot genuinely converged and
          # shipped. '' = non-convergence whose committed work-in-progress
          # is salvaged here: the run step's script aborts before its
          # \`echo attractor_exit=$?\` under the runner's default \`bash -e\`
          # when the engine exits non-zero, so the output is never written,
          # and GitHub's expression rules coerce a missing output to 0 --
          # making this step's \`== '0'\` condition true. The PR body must
          # say which of the two this is: run 31335891096 shipped a salvage
          # PR (#178) wearing the converged template's claims.
          EXIT="${{ steps.run.outputs.attractor_exit }}"

          BODY_FILE="$RUNNER_TEMP/capsule-implement/pr-body.md"
          if [ "$EXIT" = "0" ]; then
            TITLE="implement: fix for #${ISSUE} (${CAPSULE_ID})"
            {
              echo "## Implement-stage fix for #${ISSUE}"
              echo
              echo "Refs #${ISSUE}. Produced by \`task-runner.dot\` (see \`.github/capsule-pipeline/\`)"
              echo "converging against the capsule's own definition of done and gate:"
              echo "\`.github/capsule-pipeline/proposals/issue-${ISSUE}/${CAPSULE_ID}.md\` /"
              echo "\`${CAPSULE_ID}.verify.sh\`."
              echo
              echo "The gate script (the capsule's own DoD) passed, and this change was"
              echo "additionally critiqued by an LLM reviewer against the capsule's"
              echo "judgment criteria before shipping. $DUAL_NOTE"
              echo
              echo "$GATE_NOTE"
              echo
              echo "This PR is opened non-draft and is NOT auto-merged -- a human reviews"
              echo "the diff and the run evidence before merging."
              echo
              echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$BODY_FILE"
          else
            TITLE="implement: work-in-progress for #${ISSUE} (${CAPSULE_ID}) -- did not converge"
            {
              echo "## Implement-stage WORK-IN-PROGRESS for #${ISSUE} (did not converge)"
              echo
              echo "Refs #${ISSUE}. \`task-runner.dot\` (see \`.github/capsule-pipeline/\`) did"
              echo "NOT converge on this capsule within its budget; this branch salvages the"
              echo "committed work-in-progress so it is not lost. The judge's objections and"
              echo "the postmortem (if written) are in the workflow run's uploaded artifacts."
              echo
              echo "Do NOT read this PR as a proven fix: the gate/critique claims a converged"
              echo "run would carry do not apply here."
              echo
              echo "$GATE_NOTE"
              echo
              echo "This PR is opened non-draft and is NOT auto-merged -- a human reviews"
              echo "the diff and the run evidence before deciding whether to adopt, finish,"
              echo "or close this work."
              echo
              echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$BODY_FILE"
          fi

          url=$(gh pr create --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the issue with the outcome
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMENT="$RUNNER_TEMP/capsule-implement/comment.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXIT="${{ steps.run.outputs.attractor_exit }}"
          PR_URL="${{ steps.pr.outputs.url }}"

          # Three real outcomes, three honest messages. Run 31335891096
          # posted "no fix PR opened" while the SAME run's previous step had
          # just pushed a branch and opened PR #178 (non-convergence salvage
          # path) -- the old two-way template asserted a PR's absence it
          # never checked. Claim "no fix PR opened" only when none was.
          if [ "$EXIT" = "0" ] && [ -n "$PR_URL" ]; then
            {
              echo "**Implement stage: fix PR opened.**"
              echo
              echo "$PR_URL"
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          elif [ -n "$PR_URL" ]; then
            {
              echo "**Implement stage did not converge -- work-in-progress salvaged as $PR_URL.**"
              echo
              echo "task-runner.dot did not converge on a shipped fix within its iteration"
              echo "budget. The committed work-in-progress was salvaged as the PR above --"
              echo "it is NOT a proven fix; the judge's objections are in the run artifacts."
              echo "Postmortem (if written):"
              echo
              echo '```'
              cat "$GITHUB_WORKSPACE/.ai/postmortem/report.md" 2>/dev/null || echo "(no postmortem report was written)"
              echo '```'
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          else
            {
              echo "**Implement stage FAILED -- no fix PR opened.**"
              echo
              echo "task-runner.dot did not converge on a shipped fix within its"
              echo "iteration budget (or an error occurred opening the PR). Postmortem"
              echo "(if written):"
              echo
              echo '```'
              cat "$GITHUB_WORKSPACE/.ai/postmortem/report.md" 2>/dev/null || echo "(no postmortem report was written)"
              echo '```'
              echo
              echo "This is a real failure, not a transient CI hiccup -- see the workflow"
              echo "run for full logs and uploaded artifacts."
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          fi

          gh issue comment "${{ steps.locate.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$COMMENT"

      - name: "Residual secret gate: block the upload if anything secret-shaped remains"
        id: secret_gate
        # Defense in depth over the scrub step above: re-scan the evidence
        # roots (including files written AFTER the scrub, e.g. the PR body
        # and issue comment staged under $RUNNER_TEMP) with a detection set
        # deliberately BROADER than the scrub's redaction set (it adds a
        # high-entropy-token heuristic), so a secret shape the scrubber
        # doesn't know about never rides out in a public artifact. An
        # artifact with no evidence is safe; an artifact with a leaked key
        # is not -- fail toward not-uploading.
        #
        # THE VERDICT IS SPLIT BY FINDING CLASS (issue #206). This step ran
        # `scan` and blocked on ANY finding, and the measurement came back
        # 4 real runs out of 4: every one tripped the entropy heuristic on
        # legitimate worker-session payloads in
        # logs/*/sessions/*/events.jsonl -- digests, base64 fragments,
        # request ids (run 31657343281: findings at events.jsonl lines
        # 5/6/10/11/14, all shape=high-entropy-token). The evidence
        # artifact therefore NEVER survived a run, every run read red, and
        # a failed run could not be diagnosed at all. `gate` keeps the hard
        # block for every KNOWN credential shape -- the sk-/gh[posur]_/
        # github_pat_ prefixes, the end-anchored sensitive NAME=value
        # assignments, and the literal values of this job's own secrets --
        # and QUARANTINES entropy-only findings instead: it redacts those
        # spans in place as [REDACTED:entropy], RE-SCANS, and proceeds only
        # if that second pass is clean, annotating the job (::notice) with
        # the count and the file list. Nothing secret-shaped is uploaded
        # either way; the difference is that the old behavior shipped
        # NOTHING and lost the evidence, and this ships the evidence with
        # the suspicious spans removed. If the re-scan still finds
        # anything, the upload is blocked exactly as before.
        #
        # NO --never-redact FENCE IS NEEDED HERE, and that is a fact about
        # this lane, not an omission: the implement stage produces a FIX
        # BRANCH from the workspace git tree, not a capsule pair, so
        # $RUNNER_TEMP/capsule-implement holds only evidence (logs/, the
        # staged pr-body.md and comment.md). The specify workflows, whose
        # $RUNNER_TEMP/capsule-run DOES contain the capsule pair under
        # out/, pass --never-redact for it -- PR #207's rule that the pair
        # is scanned and never mutated. Should this lane ever stage a
        # to-be-pushed artifact under $RUNNER_TEMP, it must be fenced the
        # same way.
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "upload_ok=false" >> "$GITHUB_OUTPUT"
          if python3 .github/capsule-pipeline/scrub_secrets.py gate \
              "$RUNNER_TEMP/capsule-implement" \
              "$GITHUB_WORKSPACE/.ai"; then
            echo "upload_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The residual secret gate BLOCKED the run-evidence artifact upload -- either a KNOWN credential shape was found in the evidence after scrubbing, or the entropy quarantine's confirming re-scan did not come back clean (see the scan findings above for file/line/shape; the secret values themselves are never printed). Nothing was uploaded. Rotate any credential the findings implicate before touching this run's evidence." >&2
            exit 1
          fi

      - name: Upload run evidence (logs, .ai state)
        # Gated: uploads ONLY when the residual secret gate above
        # affirmatively passed. If the gate found something, failed, or
        # never ran, upload_ok != 'true' and this step is skipped --
        # fail-closed by construction.
        if: always() && steps.secret_gate.outputs.upload_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capsule-implement-issue-${{ steps.locate.outputs.issue_number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/capsule-implement
            ${{ github.workspace }}/.ai
          if-no-files-found: warn

      - name: Fail the job on genuine non-convergence
        if: always() && steps.locate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          EXIT="${{ steps.run.outputs.attractor_exit }}"
          if [ "$EXIT" != "0" ]; then
            echo "::error::task-runner.dot did not converge (exit=$EXIT) -- see the postmortem comment posted on the issue and the uploaded run evidence." >&2
            exit 1
          fi
          if [ -z "${{ steps.pr.outputs.url }}" ]; then
            echo "::error::task-runner.dot reported success but no fix PR was opened -- see the 'Push fix branch and open PR' step's log." >&2
            exit 1
          fi
          echo "Implement stage concluded successfully: ${{ steps.pr.outputs.url }}"
