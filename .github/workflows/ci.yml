name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a PR pushed again before the
# previous run finished) so we don't burn runner time on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # One job per (module, python-version) combination. Each module is its
    # own uv-managed package with its own venv, dependency group, and
    # pytest addopts (see AGENTS.md / repo root pyproject.toml — there is
    # intentionally no root dependency-group; every module's own
    # `dependency-groups.dev` + `[tool.uv.sources]` path overrides make
    # `uv sync` sufficient standalone). Modules are NOT run in one shared
    # pytest process: doing so produces `--import-mode` collisions and
    # cross-module state pollution, and bypasses each module's own
    # `addopts`.
    #
    # THE MATRIX IS DOWN TO ONE CELL, and that is the point of the P4 slim
    # (attractor-28x): twelve compat-window module copies were deleted and
    # their sole home is now `amplifier-bundle-dot-runner`, whose own CI
    # matrix runs their suites. `tool-report-outcome` is the one module this
    # repo still owns — dot-runner deliberately does not carry a
    # report_outcome tool (its bundle.md records the WAVE 5 repair), and
    # `behaviors/attractor-core.yaml` mounts this one by relative source.
    # Keep the matrix shape rather than collapsing it to a plain job: the
    # shape is what makes re-adding or removing a module a one-line change
    # that never touches branch protection (see `ci-gate` below).
    name: Unit Tests (${{ matrix.module.name }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # A red matrix cell must never mask the other cells.
      fail-fast: false
      matrix:
        # Floor (3.11, the repo-wide `requires-python` minimum) and
        # ceiling (3.13, latest stable) only. 3.12 is bracketed by both
        # and is skipped deliberately — this is a considered trade-off,
        # not an oversight.
        python-version: ["3.11", "3.13"]
        module:
          - name: tool-report-outcome
            extra_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: modules/${{ matrix.module.name }}
        run: uv sync ${{ matrix.module.extra_args }}

      - name: Run tests
        working-directory: modules/${{ matrix.module.name }}
        run: uv run pytest -q

  dot-render-gate:
    # Tier 3 of docs/designs/2026-08-23-dot-render-compliance.md: every
    # git-tracked *.dot in THIS repository must render under `dot -Tsvg`.
    #
    # Why this is a gate and not a lint rule: the spec chose DOT *because* it
    # renders -- "free visualization, PR-reviewable" is the stated reason the
    # format was picked over YAML/JSON. A shipped graph that cannot be drawn
    # has quietly stopped paying that rent. Six of sixty-three files had
    # drifted that way before this gate existed, because nothing ever asked
    # GraphViz whether they still rendered.
    #
    # SCOPE -- deliberately OUR CORPUS ONLY. The shipped engine does NOT
    # require renderability: a non-rendering graph is conforming and still
    # runs, and the RENDER-001/RENDER-002 lint rules are WARNING severity for
    # exactly that reason. This job is where "our own files must render" is
    # enforced, because this is the only place the audience is us. It never
    # touches a community author.
    #
    # This job installs graphviz, so the render check ALWAYS actually runs
    # here, and a missing `dot` is a hard failure, not a skip.
    #
    # It used to have an in-repo pytest twin
    # (`modules/loop-pipeline/tests/test_dot_render_compliance.py::
    # test_shipped_dot_renders`), which skipped with an explicit reason when
    # `dot` was absent -- a local-developer affordance, never the CI
    # behaviour. That twin left with loop-pipeline in the P4 slim
    # (attractor-28x), so THIS JOB IS NOW THE ONLY RENDER CHECK on this
    # repo's corpus. The exclusion list below is therefore self-contained;
    # it no longer has to stay in sync with a `_SWEEP_EXCLUDED_PREFIXES`
    # constant somewhere else.
    name: DOT Render Gate (every tracked .dot renders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Render every git-tracked .dot
        run: |
          set -uo pipefail

          # These hold runtime scratch and captured artifacts, not authored
          # corpus. This list is authoritative -- see the note above about
          # the retired pytest twin it used to mirror.
          failed=0
          checked=0
          while IFS= read -r f; do
            case "$f" in
              .ai/*|.amplifier/*|evals/*) continue ;;
            esac
            checked=$((checked + 1))
            if err="$(dot -Tsvg "$f" -o /dev/null 2>&1)"; then
              continue
            fi
            failed=$((failed + 1))
            echo "::error file=${f}::does not render under 'dot -Tsvg': ${err}"
          done < <(git ls-files '*.dot')

          echo ""
          echo "Checked ${checked} git-tracked .dot file(s); ${failed} failed to render."

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Run 'dot-runner lint <file>' on each -- RENDER-001 (unescaped"
            echo "inner quote) and RENDER-002 (dotted bare key) name the cause"
            echo "and the exact fix. See docs/DOT-AUTHORING-GUIDE.md."
            exit 1
          fi

          if [ "$checked" -eq 0 ]; then
            echo "::error::No .dot files were checked -- the sweep is vacuous. Failing rather than reporting a false green."
            exit 1
          fi

  opinionated-guards:
    # Root guard harness (DESIGN-repo-split.md Track A, \u00a71.4 / \u00a75 risk #2).
    #
    # ~14 guard tests used to live inside modules/loop-pipeline/tests/ purely
    # because that module's cell in the unit-tests matrix above was the
    # repo's only CI job that ever executed root `tests/` -- and yet asserted
    # on repo-root docs/, examples/, skills/, agents/, context/, bundles/,
    # behaviors/ content, NOT on loop-pipeline's own engine behavior. When
    # loop-pipeline is extracted to the runner repo (the amplifier-dot-runner
    # split), those guards would leave with it and silently stop running,
    # with CI staying green. This job is what makes the guards survive that
    # move: they were relocated to repo-root `tests/` (Track A of the split)
    # BEFORE anything was extracted, and run here independently of every
    # module.
    #
    # THE MOVE HAS NOW HAPPENED (the P4 slim, attractor-28x), and Track A
    # did its job: loop-pipeline is gone from this repo and this job still
    # runs the same guard corpus, green, having installed nothing but
    # pytest. That is the design working, not a coincidence.
    #
    # Deliberately independent of every module/, by construction: every
    # moved guard was refactored (where needed) to assert FILE CONTENT --
    # doc text, YAML/dot files, script logic loaded by path -- rather than
    # importing engine code, so this job installs nothing but pytest itself.
    # A handful of guards that genuinely could not be decoupled from the
    # live engine parser/linter (e.g. the examples/ lint-clean sweep, the
    # shipped-graph structural contract checks) deliberately stayed behind
    # in modules/loop-pipeline/tests/ -- see each split file's docstring --
    # and therefore now run in `amplifier-bundle-dot-runner`'s CI, not here.
    name: Opinionated Guards (repo root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install pytest
        run: uv pip install --system pytest pyyaml

      - name: Run root opinionated-layer guard suite
        # tests/e2e/ is a separate, manual-only live/docker smoke-test lane
        # (see tests/e2e/MANUAL_E2E.md) that needs API keys/Docker neither
        # available nor appropriate in this job -- excluded by design, not
        # an oversight.
        run: python -m pytest tests/ -q --ignore=tests/e2e

  ci-gate:
    # Aggregate "all-green" summary gate. CI produces one check context per
    # job (and per unit-tests matrix cell) -- and every one of those is
    # purely advisory: branch protection has zero required status checks,
    # so a fully red CI does not block a merge.
    #
    # The fix is NOT to require every context by name in branch protection.
    # That list is brittle: it changes shape every time a module is added,
    # renamed, or dropped from the unit-tests matrix, and a renamed/removed
    # context either silently stops being enforced or hangs every future PR
    # waiting on a check that will never report. The P4 slim
    # (attractor-28x) is the proof: it took the matrix from 13 modules to 1
    # and retired two whole jobs (live-graph-gate, type-check, both of
    # which tested modules that left for `amplifier-bundle-dot-runner`),
    # and required no branch-protection change at all.
    #
    # Instead this job is the ONE stable check to require. It depends on
    # every other job in this workflow and fails if any of them failed,
    # was cancelled, or was skipped -- so requiring only this one context
    # in branch protection is equivalent to requiring the full matrix,
    # without the matrix's brittleness. Adding, renaming, or removing a
    # module in `unit-tests.strategy.matrix.module` never requires a
    # branch-protection change: this job's `needs:` list only ever
    # references top-level job IDs, not individual matrix cells.
    #
    # `needs:` alone is not sufficient to get fail-closed semantics. By
    # default, if a job listed in `needs:` fails, GitHub Actions SKIPS any
    # dependent job rather than running it -- and a job that never runs
    # reports no failing status at all (in some branch-protection
    # configurations a skipped required check is treated as satisfied).
    # `if: always()` makes this job run regardless of upstream
    # success/failure/cancellation, and the step below then explicitly
    # inspects `needs.<job>.result` for every dependency and fails loudly
    # (a real non-zero exit, no `continue-on-error`, no `|| true`) if any
    # of them is not exactly `"success"`. That is what makes it
    # IMPOSSIBLE for this job to report green while any upstream job is
    # red, cancelled, or skipped:
    #   - unit-tests result is "failure"   -> any matrix cell failing fails
    #     the whole job group, which flips this to failure.
    #   - dot-render-gate or opinionated-guards result is "failure" -> same.
    #   - any of the three is "cancelled" (workflow run cancelled
    #     mid-flight) -> not "success" -> this job fails.
    #   - any of the three is "skipped" (e.g. a future workflow edit adds
    #     an `if:` condition to one of them that doesn't fire) -> not
    #     "success" -> this job fails. A dependency that never runs can no
    #     longer produce a silent pass here.
    name: CI Gate (all checks passed)
    if: always()
    needs:
      - unit-tests
      - dot-render-gate
      - opinionated-guards
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have succeeded
        run: |
          set -euo pipefail

          declare -A results=(
            [unit-tests]="${{ needs.unit-tests.result }}"
            [dot-render-gate]="${{ needs.dot-render-gate.result }}"
            [opinionated-guards]="${{ needs.opinionated-guards.result }}"
          )

          overall_ok=true
          for job_id in "${!results[@]}"; do
            result="${results[$job_id]}"
            echo "${job_id}: ${result}"
            if [ "${result}" != "success" ]; then
              echo "::error::Upstream job '${job_id}' did not succeed (result: ${result})"
              overall_ok=false
            fi
          done

          if [ "${overall_ok}" != "true" ]; then
            echo ""
            echo "One or more upstream jobs did not succeed. Failing the aggregate CI gate."
            exit 1
          fi

          echo ""
          echo "All upstream jobs succeeded."
