name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a PR pushed again before the
# previous run finished) so we don't burn runner time on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # One job per (module, python-version) combination. Each module is its
    # own uv-managed package with its own venv, dependency group, and
    # pytest addopts (see AGENTS.md / repo root pyproject.toml — there is
    # intentionally no root dependency-group; every module's own
    # `dependency-groups.dev` + `[tool.uv.sources]` path overrides make
    # `uv sync` sufficient standalone). Modules are NOT run in one shared
    # pytest process: doing so produces `--import-mode` collisions and
    # cross-module state pollution, and bypasses each module's own
    # `addopts` (e.g. unified-llm-client's `-m 'not integration'` marker
    # filter, which is what keeps API-key-requiring tests out of CI).
    name: Unit Tests (${{ matrix.module.name }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # A red matrix cell must never mask the other cells — one module
      # breaking should never hide a failure in the other twelve.
      fail-fast: false
      matrix:
        # Floor (3.11, the repo-wide `requires-python` minimum) and
        # ceiling (3.13, latest stable) only. 3.12 is bracketed by both
        # and is skipped deliberately — 13 modules x 3 Python versions is
        # not worth the extra runner time for the marginal coverage it
        # would add; this is a considered trade-off, not an oversight.
        python-version: ["3.11", "3.13"]
        module:
          - name: hooks-pipeline-observability
            extra_args: ""
          - name: hooks-pipeline-progress
            extra_args: ""
          - name: hooks-tool-truncation
            extra_args: ""
          - name: loop-agent
            extra_args: ""
          - name: loop-pipeline
            # tests/test_remote_dot.py imports amplifier_module_remote_source,
            # which is only wired in as the optional `remote` extra. Without
            # it, pytest collection fails before any test runs.
            extra_args: "--extra remote"
          - name: pipeline-runner
            extra_args: ""
          - name: remote-source
            extra_args: ""
          - name: tool-apply-patch
            extra_args: ""
          - name: tool-dashboard-query
            extra_args: ""
          - name: tool-pipeline-run
            extra_args: ""
          - name: tool-pipeline-status
            extra_args: ""
          - name: tool-report-outcome
            extra_args: ""
          - name: unified-llm-client
            extra_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: modules/${{ matrix.module.name }}
        run: uv sync ${{ matrix.module.extra_args }}

      - name: Run tests
        working-directory: modules/${{ matrix.module.name }}
        run: uv run pytest -q

  live-graph-gate:
    # Separate, distinctly-named job so a failure here reads as "the
    # live-graph gate broke" rather than a generic unit-test failure. See
    # AGENTS.md's "Verification gradient" — this job is the automated
    # baseline instance of the live pipeline run that section requires for
    # any engine.py / handler change. It runs
    # modules/loop-pipeline/tests/test_live_graph_gate.py specifically
    # (in addition to that file also running as part of the loop-pipeline
    # cell of the unit-tests matrix above — belt and suspenders, not
    # duplication of intent).
    name: Live-Graph Gate (loop-pipeline engine + handler dispatch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install loop-pipeline
        working-directory: modules/loop-pipeline
        run: uv sync

      - name: Run live-graph smoke test
        working-directory: modules/loop-pipeline
        run: uv run pytest tests/test_live_graph_gate.py -v

  type-check:
    # Static type checking. This replaces a former pytest case
    # (tests/unit/test_pyright_clean.py) that shelled out to pyright with a
    # hardcoded absolute path to an unrelated checkout on one developer's
    # machine, and that was gated on `skipif(shutil.which("pyright") is None)`
    # — so on any machine without pyright installed (every CI runner) it
    # silently skipped. It looked like coverage and was not.
    #
    # As a job, a missing tool is a hard failure rather than a silent skip,
    # which is the whole point of moving it here.
    #
    # SCOPE — deliberately narrow, and this is a considered decision:
    # only `unified-llm-client` is checked, because that is the only module
    # the deleted test ever claimed to cover, and it is verified clean
    # (0 errors, 0 warnings). Three other modules currently have pre-existing
    # findings (loop-agent 10, loop-pipeline 9, hooks-pipeline-observability 1)
    # and would land this job red on arrival. Widening the scope is real work
    # tracked separately — do NOT add modules here until their findings are
    # actually cleared, or this gate becomes a red check people learn to ignore.
    name: Type Check (unified-llm-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install unified-llm-client
        working-directory: modules/unified-llm-client
        run: uv sync

      - name: Run pyright
        working-directory: modules/unified-llm-client
        run: uv run --with pyright pyright unified_llm/

  ci-gate:
    # Aggregate "all-green" summary gate. Today CI produces 28 individual
    # check contexts (13 modules x 2 python versions for unit-tests, plus
    # live-graph-gate, plus type-check) -- and every one of those is purely
    # advisory: branch protection has zero required status checks, so a
    # fully red CI does not block a merge.
    #
    # The fix is NOT to require all 28 contexts by name in branch
    # protection. That list is brittle: it changes shape every time a
    # module is added, renamed, or dropped from the unit-tests matrix, and
    # a renamed/removed context either silently stops being enforced or
    # hangs every future PR waiting on a check that will never report.
    #
    # Instead this job is the ONE stable check to require. It depends on
    # every other job in this workflow and fails if any of them failed,
    # was cancelled, or was skipped -- so requiring only this one context
    # in branch protection is equivalent to requiring the full matrix,
    # without the matrix's brittleness. Adding, renaming, or removing a
    # module in `unit-tests.strategy.matrix.module` never requires a
    # branch-protection change: this job's `needs:` list only ever
    # references the three top-level job IDs (unit-tests, live-graph-gate,
    # type-check), not individual matrix cells.
    #
    # `needs:` alone is not sufficient to get fail-closed semantics. By
    # default, if a job listed in `needs:` fails, GitHub Actions SKIPS any
    # dependent job rather than running it -- and a job that never runs
    # reports no failing status at all (in some branch-protection
    # configurations a skipped required check is treated as satisfied).
    # `if: always()` makes this job run regardless of upstream
    # success/failure/cancellation, and the step below then explicitly
    # inspects `needs.<job>.result` for every dependency and fails loudly
    # (a real non-zero exit, no `continue-on-error`, no `|| true`) if any
    # of them is not exactly `"success"`. That is what makes it
    # IMPOSSIBLE for this job to report green while any upstream job is
    # red, cancelled, or skipped:
    #   - unit-tests result is "failure"   -> any matrix cell failing fails
    #     the whole job group, which flips this to failure.
    #   - live-graph-gate or type-check result is "failure" -> same.
    #   - any of the three is "cancelled" (workflow run cancelled
    #     mid-flight) -> not "success" -> this job fails.
    #   - any of the three is "skipped" (e.g. a future workflow edit adds
    #     an `if:` condition to one of them that doesn't fire) -> not
    #     "success" -> this job fails. A dependency that never runs can no
    #     longer produce a silent pass here.
    name: CI Gate (all checks passed)
    if: always()
    needs:
      - unit-tests
      - live-graph-gate
      - type-check
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have succeeded
        run: |
          set -euo pipefail

          declare -A results=(
            [unit-tests]="${{ needs.unit-tests.result }}"
            [live-graph-gate]="${{ needs.live-graph-gate.result }}"
            [type-check]="${{ needs.type-check.result }}"
          )

          overall_ok=true
          for job_id in "${!results[@]}"; do
            result="${results[$job_id]}"
            echo "${job_id}: ${result}"
            if [ "${result}" != "success" ]; then
              echo "::error::Upstream job '${job_id}' did not succeed (result: ${result})"
              overall_ok=false
            fi
          done

          if [ "${overall_ok}" != "true" ]; then
            echo ""
            echo "One or more upstream jobs did not succeed. Failing the aggregate CI gate."
            exit 1
          fi

          echo ""
          echo "All upstream jobs succeeded."
