# OpenAI coding agent -- isolated environment variant
# Uses env_* tools (env_exec, env_read_file, env_write_file, env_edit_file,
# env_grep, env_glob) instead of host-local apply_patch/file/bash/search tools.
# For use with execution_environment configurations (Docker, SSH).

bundle:
  name: attractor-agent-openai-isolated
  version: 0.1.0
  description: >
    OpenAI coding agent for isolated environments.
    Uses env_* tools instead of host-local apply_patch/file/bash/search.

includes:
  - bundle: attractor:behaviors/attractor-core
  - bundle: git+https://github.com/microsoft/amplifier-bundle-execution-environments@main#subdirectory=behaviors/env-all.yaml

providers:
  - module: provider-openai
    source: git+https://github.com/microsoft/amplifier-module-provider-openai@main
    config:
      # default_model removed: model must be set explicitly via llm_model node attribute
      # or the pipeline's model_stylesheet. No silent defaults.
      timeout: 600

session:
  orchestrator:
    module: loop-agent
    # NOTE: the same-repo `@main` pin is DELIBERATE, and cannot currently be removed.
    # Unlike tools:/hooks:/providers: sources (resolved at PARSE time against this file's
    # own directory), a session.orchestrator `source:` is resolved LATE against the
    # COMPOSED ROOT's base_path -- which in a real amplifier session is the APP's own
    # bundle directory, not this bundle's.  Measured, from a DTU install of a branch that
    # made these relative:  "loop-agent: File not found:
    # .../amplifier_app_cli/_bundle/behaviors/modules/loop-agent" -- and the session
    # refused to start.  See docs/designs/2026-08-15-composition-fix.md.
    source: git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-agent
    config:
      max_tool_rounds_per_input: 50
      default_command_timeout_ms: 120000
  context:
    module: context-simple
    source: git+https://github.com/microsoft/amplifier-module-context-simple@main

context:
  # Layer-4 additive context only (not base prompt — that is now in orchestrator config above).
  include:
    - ../context/isolated-environment-guidance.md
