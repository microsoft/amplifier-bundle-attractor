bundle:
  name: attractor-agent
  version: 0.1.0
  description: >
    Standalone Attractor coding agent (no pipeline). Defaults to Anthropic
    (Claude Code aligned) but the user can override via provider_preferences
    at the CLI. Includes amplifier-foundation for standalone use.

    Usage:
      amplifier run --bundle attractor:bundles/attractor-agent
      amplifier run --bundle attractor:bundles/attractor-agent --provider openai

includes:
  - bundle: git+https://github.com/microsoft/amplifier-foundation@main
  - bundle: attractor:behaviors/attractor-core

# --- Default provider (Anthropic) -------------------------------------------
providers:
  - module: provider-anthropic
    source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
    config:
      default_model: claude-sonnet-4-6

# --- Agent loop orchestrator -------------------------------------------------
session:
  orchestrator:
    module: loop-agent
    # NOTE: the same-repo `@main` pin is DELIBERATE here.  Unlike tools:/hooks:/providers:
    # (resolved at parse time against this file's own directory), a session.orchestrator
    # `source:` is resolved late, against the COMPOSED ROOT's base_path -- so a relative
    # source here breaks the documented `includes: - bundle: git+...#subdirectory=...`
    # path, where the user's own bundle is the root.  Probe-verified; see
    # docs/designs/2026-08-15-composition-fix.md, "Two resolution classes".
    source: git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-agent
    config:
      default_command_timeout_ms: 120000

# --- Tools (Anthropic/Claude Code aligned defaults) --------------------------
tools:
  - module: tool-filesystem
    source: git+https://github.com/microsoft/amplifier-module-tool-filesystem@main
  - module: tool-bash
    source: git+https://github.com/microsoft/amplifier-module-tool-bash@main
    config:
      timeout: 120
  - module: tool-search
    source: git+https://github.com/microsoft/amplifier-module-tool-search@main

# Layer-1 base prompt is supplied by loop-agent's provider default
# (context/system-anthropic.md for this Anthropic bundle); no system_prompt_file
# or context.include base is needed. See docs/designs/layer-1-profile-owned-system-prompt.md.
