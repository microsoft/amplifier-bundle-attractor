bundle:
  name: attractor-profile-anthropic
  version: 1.0.0
  description: >
    Anthropic coding agent profile (Claude Code aligned).
    Uses edit_file with old_string/new_string for edits, 120s default
    shell timeout, and a system prompt mirroring Claude Code conventions.

includes:
  - bundle: attractor:behaviors/attractor-core

providers:
  - module: provider-anthropic
    source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main

session:
  orchestrator:
    module: loop-agent
    source: git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-agent
    config:
      default_command_timeout_ms: 120000
      # Layer-1 base prompt (nlspec §6.1: "Provider-specific base instructions from ProviderProfile").
      # Path is relative to the bundle root; loop-agent resolves it at session init.
      # See docs/designs/layer-1-profile-owned-system-prompt.md.
      system_prompt_file: context/system-anthropic.md

tools:
  - module: tool-filesystem
    source: git+https://github.com/microsoft/amplifier-module-tool-filesystem@main
  - module: tool-bash
    source: git+https://github.com/microsoft/amplifier-module-tool-bash@main
    config:
      timeout: 120
  - module: tool-search
    source: git+https://github.com/microsoft/amplifier-module-tool-search@main
