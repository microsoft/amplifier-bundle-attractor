bundle:
  name: attractor-profile-gemini
  version: 1.0.0
  description: >
    Gemini coding agent profile (gemini-cli aligned).
    Uses edit_file for edits, includes web search/fetch tools for
    grounding, and a system prompt mirroring gemini-cli conventions.

includes:
  - bundle: attractor:behaviors/attractor-core

providers:
  - module: provider-gemini
    source: git+https://github.com/microsoft/amplifier-module-provider-gemini@main

session:
  orchestrator:
    module: loop-agent
    # NOTE: the same-repo `@main` pin is DELIBERATE here.  Unlike tools:/hooks:/providers:
    # (resolved at parse time against this file's own directory), a session.orchestrator
    # `source:` is resolved late, against the COMPOSED ROOT's base_path -- so a relative
    # source here breaks the documented `includes: - bundle: git+...#subdirectory=...`
    # path, where the user's own bundle is the root.  Probe-verified; see
    # docs/designs/2026-08-15-composition-fix.md, "Two resolution classes".
    source: git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-agent
    config:
      default_command_timeout_ms: 10000
  # session.context is REQUIRED by core 1.6.0 ("Configuration must specify
  # session.context"). This profile only includes attractor-core (which provides
  # no context module), so it must be declared explicitly here.
  context:
    module: context-simple
    source: git+https://github.com/microsoft/amplifier-module-context-simple@main

tools:
  - module: tool-filesystem
    source: git+https://github.com/microsoft/amplifier-module-tool-filesystem@main
  - module: tool-bash
    source: git+https://github.com/microsoft/amplifier-module-tool-bash@main
    config:
      timeout: 10
  - module: tool-search
    source: git+https://github.com/microsoft/amplifier-module-tool-search@main
  - module: tool-web
    source: git+https://github.com/microsoft/amplifier-module-tool-web@main
